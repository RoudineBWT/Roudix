<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Catppuccin Latte background gradient, pendant clair du Tokyo Night -->
    <linearGradient id="bgL" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#eff1f8"/>
      <stop offset="1"   stop-color="#dbdff0"/>
    </linearGradient>
    <linearGradient id="sheenL" x1="24" y1="3" x2="24" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dialL" x1="10" y1="34" x2="38" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e66f5"/>
      <stop offset="0.55" stop-color="#8839ef"/>
      <stop offset="1" stop-color="#fe640b"/>
    </linearGradient>
    <radialGradient id="flakeGlowL" cx="24" cy="17" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fe640b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fe640b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle Papirus/Tela-light : coin ~22% -->
  <rect x="3" y="3" width="42" height="42" rx="10" fill="url(#bgL)"/>
  <rect x="3" y="3" width="42" height="17" rx="10" fill="url(#sheenL)"/>
  <rect x="3" y="3" width="42" height="42" rx="10" fill="none"
        stroke="#4c4f69" stroke-opacity="0.08" stroke-width="1"/>

  <circle cx="24" cy="17" r="9" fill="url(#flakeGlowL)"/>

  <!-- flocon Roudix -->
  <g stroke="#5c5f77" stroke-width="1.4" stroke-linecap="round" opacity="0.85">
    <g transform="translate(24 17)">
      <line x1="0" y1="-7" x2="0" y2="7"/>
      <line x1="-6.06" y1="-3.5" x2="6.06" y2="3.5"/>
      <line x1="-6.06" y1="3.5" x2="6.06" y2="-3.5"/>
      <line x1="0" y1="-7" x2="-2" y2="-4.3"/>
      <line x1="0" y1="-7" x2="2" y2="-4.3"/>
      <line x1="0" y1="7" x2="-2" y2="4.3"/>
      <line x1="0" y1="7" x2="2" y2="4.3"/>
    </g>
  </g>

  <!-- jauge de scheduler -->
  <g>
    <path d="M 11 35 A 13 13 0 0 1 37 35"
          fill="none" stroke="#ccd0da" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 11 35 A 13 13 0 0 1 30.5 24.2"
          fill="none" stroke="url(#dialL)" stroke-width="3.4" stroke-linecap="round"/>
    <g stroke="#9ca0b0" stroke-width="1.1" stroke-linecap="round">
      <line x1="11" y1="35" x2="13.2" y2="35"/>
      <line x1="15.9" y1="24.9" x2="17.6" y2="26.6"/>
      <line x1="24" y1="21.7" x2="24" y2="24"/>
      <line x1="32.1" y1="24.9" x2="30.4" y2="26.6"/>
      <line x1="37" y1="35" x2="34.8" y2="35"/>
    </g>
    <line x1="24" y1="35" x2="18.5" y2="28.5"
          stroke="#4c4f69" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="24" cy="35" r="2.4" fill="#4c4f69"/>
    <circle cx="24" cy="35" r="1" fill="#eff1f8"/>
  </g>
</svg>
