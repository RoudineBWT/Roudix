<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background circle, flat Papirus-style solid fill -->
  <circle cx="64" cy="64" r="64" fill="#3a3358"/>

  <!-- subtle two-tone split background (Papirus often shades half a shape darker) -->
  <path d="M64 0 A64 64 0 0 1 64 128 Z" fill="#332c4d"/>

  <!-- Paper plane, flat geometric facets, no gradients -->
  <!-- left wing (light) -->
  <polygon points="64,28 40,92 64,80" fill="#f4f4f4"/>
  <!-- right wing (accent purple, flat) -->
  <polygon points="64,28 88,92 64,80" fill="#c6b6f2"/>
  <!-- left wing shade (slightly darker flat tone for depth) -->
  <polygon points="64,28 40,92 52,86 64,40" fill="#d9d9d9"/>
  <!-- right wing shade -->
  <polygon points="64,28 88,92 76,86 64,40" fill="#a993e6"/>
  <!-- center spine -->
  <polygon points="64,28 58,96 64,104 70,96" fill="#241f38"/>
  <!-- center highlight strip -->
  <polygon points="64,28 61,96 64,100 67,96" fill="#3a3358"/>
</svg>
