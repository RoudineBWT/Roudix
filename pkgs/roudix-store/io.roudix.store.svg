<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Roudix Store</title>
  <defs>
    <linearGradient id="bg" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a2b42"/>
      <stop offset="1" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="sheen" x1="24" y1="3" x2="24" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bag" x1="0" y1="18" x2="0" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fab387"/>
      <stop offset="1" stop-color="#eba0ac"/>
    </linearGradient>
  </defs>

  <!-- carré arrondi Papirus/Tela -->
  <rect x="3" y="3" width="42" height="42" rx="10" fill="url(#bg)"/>
  <rect x="3" y="3" width="42" height="17" rx="10" fill="url(#sheen)"/>
  <rect x="3" y="3" width="42" height="42" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- ombre portée -->
  <ellipse cx="24" cy="40.6" rx="11" ry="1.4" fill="#000" opacity="0.25"/>

  <!-- anse -->
  <path d="M18.5 19 V15.5 a5.5 5.5 0 0 1 11 0 V19" fill="none" stroke="#f2cdcd" stroke-width="2.4" stroke-linecap="round"/>

  <!-- sac -->
  <path d="M12.5 19 H35.5 a1.6 1.6 0 0 1 1.6 1.7 L36 37.6 a2.4 2.4 0 0 1 -2.4 2.2 H14.4 a2.4 2.4 0 0 1 -2.4 -2.2 L10.9 20.7 a1.6 1.6 0 0 1 1.6 -1.7 Z" fill="url(#bag)"/>
  <path d="M12.5 19 H35.5 a1.6 1.6 0 0 1 1.6 1.7 L37.2 22.4 H10.8 L10.9 20.7 a1.6 1.6 0 0 1 1.6 -1.7 Z" fill="#fff" opacity="0.22"/>
  <circle cx="18.5" cy="21.2" r="1" fill="#1a1b26" opacity="0.55"/>
  <circle cx="29.5" cy="21.2" r="1" fill="#1a1b26" opacity="0.55"/>

  <!-- flocon Roudix -->
    <g transform="translate(24 30.6)" stroke="#1a1b26" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g transform="rotate(0)"><line x1="0" y1="-5.4" x2="0" y2="5.4"/></g>
    <g transform="rotate(60)"><line x1="0" y1="-5.4" x2="0" y2="5.4"/></g>
    <g transform="rotate(120)"><line x1="0" y1="-5.4" x2="0" y2="5.4"/></g>
    <path transform="rotate(0)" d="M-1.5 -3.13 L0 -4.32 L1.5 -3.13" stroke-width="1.04"/>
    <path transform="rotate(60)" d="M-1.5 -3.13 L0 -4.32 L1.5 -3.13" stroke-width="1.04"/>
    <path transform="rotate(120)" d="M-1.5 -3.13 L0 -4.32 L1.5 -3.13" stroke-width="1.04"/>
    <path transform="rotate(180)" d="M-1.5 -3.13 L0 -4.32 L1.5 -3.13" stroke-width="1.04"/>
    <path transform="rotate(240)" d="M-1.5 -3.13 L0 -4.32 L1.5 -3.13" stroke-width="1.04"/>
    <path transform="rotate(300)" d="M-1.5 -3.13 L0 -4.32 L1.5 -3.13" stroke-width="1.04"/>
