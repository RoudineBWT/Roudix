name: Check path references

on:
  push:
    branches: [dev, testing, main]
  pull_request:

# Least privilege: these jobs only read the repo (PR code must never get a write token)
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check path references in pkgs/ and iso/roudix-installer/
        run: python3 scripts/check-path-refs.py
