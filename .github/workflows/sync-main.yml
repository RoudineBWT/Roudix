name: Sync testing to main

on:
  schedule:
    - cron: '0 3 */2 * *'  # tous les 2 jours à 03h00 UTC
  workflow_dispatch:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Save main's flake.lock (pre-merge)
        run: cp flake.lock /tmp/flake.lock.main

      # Merge testing into main locally first — nothing is pushed yet. If this
      # conflicts or fails, the job stops here and main is untouched.
      - name: Merge testing into main (local, not pushed yet)
        run: |
          git fetch origin testing
          git merge origin/testing --no-edit

      # If testing already carried its own flake.lock changes (someone ran
      # `nix flake update` themselves and tested it before merging), the
      # merge above already brought that lock in — respect it instead of
      # blindly re-updating on top of a lock the author deliberately pinned
      # and validated. Only auto-update when the merge left the lock as it
      # was on main.
      - name: Check whether the merge already changed flake.lock
        id: lock_status
        run: |
          if diff -q /tmp/flake.lock.main flake.lock > /dev/null; then
            echo "changed_by_testing=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed_by_testing=true" >> "$GITHUB_OUTPUT"
            echo "flake.lock was already updated on testing — skipping auto-update, using testing's lock as-is."
          fi

      - name: Update flake inputs (only if testing didn't already do it)
        if: steps.lock_status.outputs.changed_by_testing == 'false'
        run: nix flake update --accept-flake-config

      # Several files under hosts/roudix/ and modules/home/ are
      # machine-specific and gitignored (.gitignore lists
      # hardware-configuration.nix, username.nix, local.nix, etc.) — they
      # only exist on the real roudix box. Most are guarded with
      # `builtins.pathExists` in the flake (hosts/roudix/local.nix,
      # modules/system/boot.local.nix, modules/home/local.nix) so Nix skips
      # them gracefully when absent — no stub needed for those. The ones
      # below are NOT guarded (imported unconditionally), so a bare CI
      # checkout fails evaluation before it ever reaches the build.
      #
      # These stubs are CI-only. Nix flakes only see files tracked by Git
      # (even untracked files present on disk are invisible to the
      # evaluator), so after writing each stub we register it with
      # `git add -N -f` (intent-to-add, forced past .gitignore: makes the
      # path visible to Nix without staging real content). Every stub
      # created here is fully removed from both the index and the working
      # tree right after the build gate below, before the commit step, so
      # none of them can ever end up in a pushed commit or leak into
      # roudix.autoupdate on the real machine.
      - name: Create CI-only stubs for required machine-local files
        id: local_stubs
        run: |
          CREATED=""

          if [ ! -f hosts/roudix/hardware-configuration.nix ]; then
            cat > hosts/roudix/hardware-configuration.nix << 'EOF'
          { config, lib, pkgs, modulesPath, ... }:

          {
            imports = [ (modulesPath + "/installer/scan/not-detected.nix") ];

            boot.initrd.availableKernelModules = [ "xhci_pci" "ahci" "nvme" "usbhid" "sd_mod" ];
            boot.initrd.kernelModules = [ ];
            boot.kernelModules = [ "kvm-intel" ];
            boot.extraModulePackages = [ ];

            fileSystems."/" = {
              device = "/dev/disk/by-label/nixos";
              fsType = "ext4";
            };

            swapDevices = [ ];

            nixpkgs.hostPlatform = lib.mkDefault "x86_64-linux";
            hardware.cpu.intel.updateMicrocode = lib.mkDefault true;
          }
          EOF
            git add -N -f hosts/roudix/hardware-configuration.nix
            CREATED="$CREATED hosts/roudix/hardware-configuration.nix"
            echo "Created CI-only stub: hosts/roudix/hardware-configuration.nix"
          fi

          # flake.nix imports this directly as a plain string: `username = import ./hosts/roudix/username.nix;`
          if [ ! -f hosts/roudix/username.nix ]; then
            cat > hosts/roudix/username.nix << 'EOF'
          "ci-runner"
          EOF
            git add -N -f hosts/roudix/username.nix
            CREATED="$CREATED hosts/roudix/username.nix"
            echo "Created CI-only stub: hosts/roudix/username.nix"
          fi

          echo "created_files=$CREATED" >> "$GITHUB_OUTPUT"

      # Hard gate: build the actual system closure before anything is
      # pushed. A failure here (bad merge, stale/broken input, whether from
      # testing's own lock or from our auto-update) stops the workflow —
      # main is never left in a broken state for roudix.autoupdate machines
      # to pick up unattended.
      - name: Build NixOS configuration (validation gate)
        run: |
          nix build .#nixosConfigurations.roudix.config.system.build.toplevel \
            --accept-flake-config \
            --no-link \
            -L

      # Clean up every CI-only stub immediately after it's done its job,
      # and before anything is committed — belt-and-suspenders against any
      # of them ever ending up in a pushed commit.
      - name: Remove CI-only stubs for machine-local files
        if: steps.local_stubs.outputs.created_files != ''
        run: |
          for f in ${{ steps.local_stubs.outputs.created_files }}; do
            git reset -- "$f"
            rm -f "$f"
          done

      - name: Commit updated lock, if any
        run: |
          if ! git diff --quiet -- flake.lock; then
            git add flake.lock
            git commit -m "chore: nix flake update (auto, post-merge)"
          fi

      - name: Push
        run: git push origin main
