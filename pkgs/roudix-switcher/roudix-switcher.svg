<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Roudix Customizer</title>
  <desc>Trois sliders aux couleurs du logo Roudix (peach, flamingo, maroon) sur fond Catppuccin Mocha.</desc>

  <!-- Badge (ombre + fond, même structure que les autres icônes Roudix) -->
  <rect opacity="0.2" width="46" height="46" x="1" y="2" rx="11"/>
  <rect fill="#1e1e2e" width="46" height="46" x="1" y="1" rx="11"/>
  <path fill="#fff" opacity="0.06"
    d="M12,1 C6,1 1,6 1,12 v1 C1,7 6,2 12,2 h24 c6,0 11,5 11,11 v-1 C47,6 42,1 36,1 Z"/>

  <!-- Slider 1 : peach, curseur proche du début -->
  <rect fill="#45475a" width="30" height="4" x="9" y="12" rx="2"/>
  <rect fill="#fab387" width="16" height="4" x="9" y="12" rx="2"/>
  <circle fill="#181825" cx="25" cy="14" r="5.5"/>
  <circle fill="#fab387" cx="25" cy="14" r="4.5"/>

  <!-- Slider 2 : flamingo, curseur au milieu -->
  <rect fill="#45475a" width="30" height="4" x="9" y="22" rx="2"/>
  <rect fill="#f2cdcd" width="22" height="4" x="9" y="22" rx="2"/>
  <circle fill="#181825" cx="31" cy="24" r="5.5"/>
  <circle fill="#f2cdcd" cx="31" cy="24" r="4.5"/>

  <!-- Slider 3 : maroon, curseur proche de la fin -->
  <rect fill="#45475a" width="30" height="4" x="9" y="32" rx="2"/>
  <rect fill="#eba0ac" width="9" height="4" x="9" y="32" rx="2"/>
  <circle fill="#181825" cx="18" cy="34" r="5.5"/>
  <circle fill="#eba0ac" cx="18" cy="34" r="4.5"/>
</svg>
