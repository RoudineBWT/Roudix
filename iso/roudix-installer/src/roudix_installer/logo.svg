<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc878"/>
      <stop offset="55%" stop-color="#f2b05e"/>
      <stop offset="100%" stop-color="#ff8c42"/>
    </linearGradient>
    <linearGradient id="gem-shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5ebdd" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f5ebdd" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- gem body: top table + facets -->
  <polygon points="100,18 150,55 170,95 140,182 60,182 30,95 50,55"
           fill="url(#gem)" stroke="#211a15" stroke-width="3" stroke-linejoin="round"/>

  <!-- facet lines -->
  <polyline points="50,55 100,72 150,55" fill="none" stroke="#211a15" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
  <polyline points="30,95 100,72 170,95" fill="none" stroke="#211a15" stroke-width="2" stroke-linejoin="round" opacity="0.5"/>
  <polyline points="100,72 60,182" fill="none" stroke="#211a15" stroke-width="2" opacity="0.4"/>
  <polyline points="100,72 100,182" fill="none" stroke="#211a15" stroke-width="2" opacity="0.4"/>
  <polyline points="100,72 140,182" fill="none" stroke="#211a15" stroke-width="2" opacity="0.4"/>

  <!-- shine -->
  <polygon points="100,18 150,55 100,72 50,55" fill="url(#gem-shine)"/>
</svg>
