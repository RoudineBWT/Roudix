name: Update testing flake.lock

on:
  schedule:
    - cron: '0 1 * * *'  # tous les jours à 01h00 UTC
  workflow_dispatch:

# Évite que ce job et le merge dev→testing poussent en même temps
concurrency:
  group: testing-branch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Update flake inputs
        run: nix flake update --accept-flake-config

      - name: Check whether flake.lock changed
        id: lock_status
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "flake.lock already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create CI-only stubs for required machine-local files
        if: steps.lock_status.outputs.changed == 'true'
        id: local_stubs
        run: |
          CREATED=""

          # One pair of stubs per host directory (hosts/roudix, hosts/nixie,
          # ...): flake.nix discovers every hosts/<name>/ automatically and
          # imports each one's username.nix / hardware-configuration.nix.
          cat > /tmp/hw-stub.nix << 'EOF'
          { config, lib, pkgs, modulesPath, ... }:

          {
            imports = [ (modulesPath + "/installer/scan/not-detected.nix") ];

            boot.initrd.availableKernelModules = [ "xhci_pci" "ahci" "nvme" "usbhid" "sd_mod" ];
            boot.initrd.kernelModules = [ ];
            boot.kernelModules = [ "kvm-intel" ];
            boot.extraModulePackages = [ ];

            fileSystems."/" = {
              device = "/dev/disk/by-label/nixos";
              fsType = "ext4";
            };

            swapDevices = [ ];

            nixpkgs.hostPlatform = lib.mkDefault "x86_64-linux";
            hardware.cpu.intel.updateMicrocode = lib.mkDefault true;
          }
          EOF

          for host_dir in hosts/*/; do
            host="$(basename "$host_dir")"
            [ -f "hosts/$host/configuration.nix" ] || continue

            if [ ! -f "hosts/$host/hardware-configuration.nix" ]; then
              cp /tmp/hw-stub.nix "hosts/$host/hardware-configuration.nix"
              git add -N -f "hosts/$host/hardware-configuration.nix"
              CREATED="$CREATED hosts/$host/hardware-configuration.nix"
              echo "Created CI-only stub: hosts/$host/hardware-configuration.nix"
            fi

            # flake.nix imports this as a plain string per host:
            # `username = import ./hosts/<host>/username.nix;`
            if [ ! -f "hosts/$host/username.nix" ]; then
              echo '"ci-runner"' > "hosts/$host/username.nix"
              git add -N -f "hosts/$host/username.nix"
              CREATED="$CREATED hosts/$host/username.nix"
              echo "Created CI-only stub: hosts/$host/username.nix"
            fi
          done

          echo "created_files=$CREATED" >> "$GITHUB_OUTPUT"

      # Si le build casse, on ne pousse rien : testing garde son ancien lock.
      - name: Build NixOS configuration (validation gate)
        if: steps.lock_status.outputs.changed == 'true'
        run: |
          # Every host is validated, not just roudix: nixie self-updates from
          # this branch unattended, so a build that only breaks for it must
          # stop the workflow here too.
          for host_dir in hosts/*/; do
            host="$(basename "$host_dir")"
            [ -f "hosts/$host/configuration.nix" ] || continue
            echo "::group::Build $host"
            nix build ".#nixosConfigurations.$host.config.system.build.toplevel" \
              --accept-flake-config \
              --no-link \
              -L
            echo "::endgroup::"
          done

      - name: Remove CI-only stubs
        if: steps.lock_status.outputs.changed == 'true' && steps.local_stubs.outputs.created_files != ''
        run: |
          for f in ${{ steps.local_stubs.outputs.created_files }}; do
            git reset -- "$f"
            rm -f "$f"
          done

      - name: Commit and push
        if: steps.lock_status.outputs.changed == 'true'
        run: |
          git add flake.lock
          git commit -m "chore: nix flake update (auto, daily)"
          git push origin testing
