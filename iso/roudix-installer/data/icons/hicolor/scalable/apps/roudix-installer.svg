<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Roudix Installer app icon — squircle base Catppuccin Mocha + flocon
       Roudix (peach/flamingo/maroon/rosewater) + badge de progression. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <path d="M64 4 C110 4 124 18 124 64 C124 110 110 124 64 124
           C18 124 4 110 4 64 C4 18 18 4 64 4 Z" fill="url(#bg)"/>
  <path d="M64 4 C110 4 124 18 124 64 C124 70 123 75 122 80
           C118 40 96 12 64 12 C32 12 10 40 6 80
           C5 75 4 70 4 64 C4 18 18 4 64 4 Z" fill="url(#glass)"/>

  <g transform="translate(64,58) scale(0.33)" filter="url(#soft)">
    <g id="arm-group">
      <rect x="-14" y="-155" width="28" height="110" rx="14" fill="#fab387"/>
      <polygon points="0,-170 12,-148 0,-130 -12,-148" fill="#f2cdcd"/>
      <g transform="rotate(-30) translate(0,-100)">
        <rect x="-10" y="-50" width="20" height="52" rx="10" transform="rotate(30)" fill="#eba0ac"/>
        <polygon points="0,-60 8,-42 0,-26 -8,-42" transform="rotate(30)" fill="#f2cdcd"/>
      </g>
      <g transform="rotate(30) translate(0,-100)">
        <rect x="-10" y="-50" width="20" height="52" rx="10" transform="rotate(-30)" fill="#eba0ac"/>
        <polygon points="0,-60 8,-42 0,-26 -8,-42" transform="rotate(-30)" fill="#f2cdcd"/>
      </g>
    </g>
    <use href="#arm-group" transform="rotate(60)"/>
    <use href="#arm-group" transform="rotate(120)"/>
    <use href="#arm-group" transform="rotate(180)"/>
    <use href="#arm-group" transform="rotate(240)"/>
    <use href="#arm-group" transform="rotate(300)"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#f5e0dc" stroke-width="18"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#eba0ac" stroke-width="10"/>
    <circle cx="0" cy="0" r="10" fill="#fab387"/>
  </g>

  <g filter="url(#soft)">
    <circle cx="92" cy="92" r="19" fill="#a6e3a1" stroke="#1e1e2e" stroke-width="3"/>
    <path d="M92 84 v12 M86 92 l6 7 l6 -7" fill="none" stroke="#1e1e2e" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
