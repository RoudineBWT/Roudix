<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <title>Roudix Config (Light)</title>
  <desc>Disposition tuilée aux couleurs du logo Roudix (peach, flamingo, maroon) dont la dernière fenêtre est un engrenage de configuration.</desc>

  <!-- Badge (ombre + fond, même structure que les autres icônes Roudix) -->
  <rect opacity="0.15" width="46" height="46" x="1" y="2" rx="11"/>
  <rect fill="#fbf5ee" width="46" height="46" x="1" y="1" rx="11"/>
  <path fill="#fff" opacity="0.5"
    d="M12,1 C6,1 1,6 1,12 v1 C1,7 6,2 12,2 h24 c6,0 11,5 11,11 v-1 C47,6 42,1 36,1 Z"/>

  <!-- Disposition tuilée : une grande fenêtre à gauche, deux empilées à droite -->
  <rect fill="#e0661a" x="8"  y="8"    width="15" height="30"   rx="3"/>
  <rect fill="#e0a030" x="25" y="8"    width="14" height="10.5" rx="3"/>
  <rect fill="#c98a1e" x="25" y="19.5" width="14" height="10.5" rx="3"/>
  <!-- barres de titre -->
  <g fill="#fff" opacity="0.4">
    <rect x="8"  y="8"    width="15" height="3" rx="1.5"/>
    <rect x="25" y="8"    width="14" height="3" rx="1.5"/>
    <rect x="25" y="19.5" width="14" height="3" rx="1.5"/>
  </g>

  <!-- Engrenage : la « troisième fenêtre » de la colonne de droite -->
  <circle cx="31" cy="37" r="8.9" fill="#f1e6d9"/>
  <circle cx="31" cy="37" r="8.9" fill="none" stroke="#d2c0ad" stroke-width="0.8"/>
  <path fill="#3b2f27" d="M29.48,31.51 L29.75,29.50 L32.25,29.50 L32.52,31.51 L33.81,32.04 L35.41,30.81 L37.19,32.59 L35.96,34.19 L36.49,35.48 L38.50,35.75 L38.50,38.25 L36.49,38.52 L35.96,39.81 L37.19,41.41 L35.41,43.19 L33.81,41.96 L32.52,42.49 L32.25,44.50 L29.75,44.50 L29.48,42.49 L28.19,41.96 L26.59,43.19 L24.81,41.41 L26.04,39.81 L25.51,38.52 L23.50,38.25 L23.50,35.75 L25.51,35.48 L26.04,34.19 L24.81,32.59 L26.59,30.81 L28.19,32.04 Z"/>
  <circle cx="31" cy="37" r="2.4" fill="#f1e6d9"/>
</svg>
