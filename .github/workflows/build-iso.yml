name: "💿 Build Roudix ISO"

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune -af || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Prepare roudix-cfg (embed main flake into ISO)
        run: |
          mkdir -p iso/roudix-cfg
          rsync -av \
            --exclude='iso/' \
            --exclude='.git/' \
            --exclude='result' \
            . iso/roudix-cfg/

      - name: Track roudix-cfg in Git (requis par Nix flake)
        run: |
          git config user.email "ci@roudix"
          git config user.name "Roudix CI"
          git add -f iso/roudix-cfg

      - name: Lock flake inputs (disko + roudix-installer)
        run: |
          cd iso
          nix flake lock --accept-flake-config

      - name: Build ISO
        run: |
          cd iso
          nix build .#packages.x86_64-linux.iso \
            --accept-flake-config \
            --option sandbox false \
            -L

      - name: Rename ISO
        run: |
          ISO_PATH=$(readlink -f iso/result/iso/*.iso)
          SHORT_SHA=$(git rev-parse --short HEAD)
          ISO_NAME="roudix-${SHORT_SHA}.iso"
          cp "$ISO_PATH" "$ISO_NAME"
          echo "ISO_NAME=$ISO_NAME" >> $GITHUB_ENV
          echo "ISO_PATH=$(pwd)/$ISO_NAME" >> $GITHUB_ENV

      - name: Configure AWS CLI for Cloudflare R2
        run: |
          aws configure set aws_access_key_id "${{ secrets.R2_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.R2_SECRET_ACCESS_KEY }}"
          aws configure set default.region auto

      - name: Remove obsolete ISOs from R2
        run: |
          aws s3 rm "s3://${{ secrets.R2_BUCKET_NAME }}/" \
            --recursive \
            --exclude "*" \
            --include "roudix-*.iso" \
            --endpoint-url "https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com"

      - name: Upload new ISO to R2
        run: |
          aws s3 cp "$ISO_PATH" "s3://${{ secrets.R2_BUCKET_NAME }}/$ISO_NAME" \
            --endpoint-url "https://${{ secrets.CF_ACCOUNT_ID }}.r2.cloudflarestorage.com"

      - name: Publish download link in job summary
        run: |
          echo "### 💿 Nouvelle ISO Roudix disponible" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[$ISO_NAME](${{ secrets.R2_PUBLIC_URL }}/$ISO_NAME)" >> "$GITHUB_STEP_SUMMARY"
