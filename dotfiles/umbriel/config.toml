# ═══════════════════════════════════════════════════════════════════════
# Config Umbriel — traduite depuis niri.kdl (animation/autostart/display/
# input/keybinds/layout/misc/noctalia/rules) pour Roudix.
#
# ⚠️  TOUT CE QUI EST MARQUÉ "TODO" DOIT ÊTRE VÉRIFIÉ AVANT USAGE.
# Umbriel est jeune (config keys/actions peuvent encore bouger), et sa
# syntaxe diffère fondamentalement de niri sur plusieurs points. Chaque
# endroit où la traduction est une approximation (pas un équivalent
# garanti) est commenté avec "# ⚠".
#
# Doc officielle : https://docs.noctalia.dev/umbriel/
# ═══════════════════════════════════════════════════════════════════════

[general]
# TODO: lance `umbriel outputs` une fois dans la session et remplace
# DP-1 / DP-3 plus bas par les vrais noms de connecteur
# (ex: DP-1, HDMI-A-1). niri accepte les noms "Marque Modèle Série" mais
# Umbriel veut le nom du connecteur physique.
autostart = ["noctalia", "discord", "openrgb", "swww-daemon"]
# ⚠ "xwayland-satellite" n'est PAS remis dans autostart : Umbriel le
# lance lui-même via xwayland=true (spawn intégré au compositeur, pas
# un binaire à lancer à la main comme sous niri).
mod_key = "Super"
xwayland = true
show_cheatsheet = false          # niri: hotkey-overlay { skip-at-startup }
focus_on_activate = false

[environment]
LD_PRELOAD = ""
MOZ_ENABLE_WAYLAND = "1"
XDG_SESSION_TYPE = "wayland"
XDG_CURRENT_DESKTOP = "umbriel"   # adapté (était "niri")
XDG_SESSION_DESKTOP = "umbriel"   # adapté (était "niri")
MOZ_DBUS_REMOTE = "1"
GDK_BACKEND = "wayland"
QT_AUTO_SCREEN_SCALE_FACTOR = "1"
QT_WAYLAND_FORCE_DPI = "physical"
EGL_PLATFORM = "wayland"
CLUTTER_BACKEND = "wayland"
TERM = "ghostty"
TERMINAL = "ghostty"
_JAVA_AWT_WM_NONREPARENTING = "1"
ELECTRON_OZONE_PLATFORM_HINT = "auto"
QT_QPA_PLATFORMTHEME = "qt6ct"
QT_QPA_PLATFORMTHEME_QT6 = "qt6ct"
GTK_IM_MODULE = "simple"

[workspaces]
back_and_forth = true             # niri: workspace-auto-back-and-forth

# ── Couleurs (depuis noctalia.kdl) ────────────────────────────────────
[colors]
# ⚠ niri avait aussi une couleur "urgent" (#a7cce1) sur focus-ring/border/
# tab-indicator ; Umbriel n'a pas de couleur "urgent" dédiée pour les
# bordures de fenêtre. Je la réutilise ici comme couleur d'avertissement
# générique (usage différent, à valider visuellement).
warning = "#a7cce1FF"

# ── Apparence ──────────────────────────────────────────────────────────
[appearance]
prefer_no_csd = true
corner_radius = 20                # niri: geometry-corner-radius 20 (règle globale)
border_focused = "#9dd2c0FF"      # niri: focus-ring/border active-color
border_unfocused = "#0e1214FF"    # niri: focus-ring/border inactive-color
insert_hint_color = "#9dd2c080"   # niri: insert-hint color
# border_width / outer_border_width : pas de valeur explicite dans ta config
# niri (donc pas touché, défauts Umbriel conservés : 2 / 0)

[appearance.blur]
enabled = true                    # niri: window-rule global { background-effect { blur true } }
passes = 2                        # niri: blur { passes 2 }
noise = 0.03                      # niri: blur { noise 0.03 }
saturation = 1.0                  # niri: blur { saturation 1.0 }
# ⚠ niri: blur { offset 3.0 } n'a pas d'équivalent direct (moteurs de blur
# différents — niri vs SceneFX). "radius"/"brightness"/"contrast" restent
# aux défauts Umbriel ; à retoucher visuellement.

[appearance.shadow]
enabled = true
color = "#00000070"               # niri: shadow { color "#00000070" }

# ── Survol (overview) ───────────────────────────────────────────────────
# Rien de spécifique dans ta config niri, défauts Umbriel conservés.

# ── Layout ───────────────────────────────────────────────────────────────
[layout]
mode = "scrolling"
gap = 9                           # niri: layout { gaps 9 }
width_presets = [0.33333, 0.5, 0.66667]

[layout.scrolling]
# ⚠ niri: center-focused-column "never" n'a PAS d'équivalent trouvé dans
# Umbriel (pas d'option pour désactiver l'auto-centrage de la colonne
# focus). center_underfull_strip ci-dessous est un concept différent
# (centrer la bande entière si elle est plus étroite que l'écran, pas le
# comportement de centrage automatique au focus).
center_underfull_strip = true
# ⚠ niri: struts {} (vide = aucune marge réservée) — pas d'équivalent
# trouvé dans la doc Umbriel consultée, probablement non nécessaire.
# ⚠ niri: layout { background-color "transparent" } (nécessaire pour que
# noctalia-shell affiche le fond d'écran sous niri) — pas de clé
# équivalente trouvée ; à vérifier si nécessaire sous Umbriel (le support
# Noctalia y est de toute façon natif/officiel).

# ── Outputs (depuis display.kdl) ───────────────────────────────────────
# TODO: remplace ces noms par les vrais connecteurs (`umbriel outputs`).

[output.DP-1]           # Lenovo Legion 27Q-10, 2560x1440@240
mode = "2560x1440@240.000"
position = [1920, 0]
scale = 1
vrr = "fullscreen"                # niri: variable-refresh-rate on-demand=true
# 5 workspaces nommés, dans l'ordre déclaré dans ton rules.kdl :
workspaces = ["\uf0239", "\ue8da", "\ue795", "\uf0297", "\uf024b"]

[output.DP-3]              # HKC 24E4, 1920x1080@165
mode = "1920x1080@165.001"
position = [0, 0]
scale = 1
# 3 workspaces nommés :
workspaces = ["\uf1ff", "\uf075a", "\ue743"]

# ── Input (depuis input.kdl + misc.kdl) ─────────────────────────────────
[input]
# middle_click_paste laissé au défaut (true), pas configuré côté niri.

[input.keyboard]
layout = "us"
variant = "intl"
# ⚠ niri: keyboard { numlock } (numlock activé au démarrage) — je n'ai
# trouvé AUCUNE clé Umbriel équivalente dans la doc consultée. Solution
# de contournement possible : lancer `numlockx on` (ou équivalent) dans
# `general.autostart` si le paquet est disponible.

[input.touchpad]
tap = true
natural_scroll = true

[input.mouse]
accel_profile = "flat"

[input.focus]
follows_mouse = true              # niri: focus-follows-mouse

[input.cursor]
theme = "Bibata-Modern-Ice"       # misc.kdl: cursor { xcursor-theme ... }
size = 24
hide_when_typing = true
hide_timeout_ms = 1000            # niri: hide-after-inactive-ms 1000

# ═══════════════════════════════════════════════════════════════════════
# Keybinds (depuis keybinds.kdl)
# ═══════════════════════════════════════════════════════════════════════
[keybinds]

# ─── Applications ───
"Mod+Return" = "spawn:ghostty"
"Mod+D" = "spawn:noctalia msg panel-toggle launcher"
"Mod+Shift+B" = "spawn:zen-twilight"
"Mod+B" = "spawn:brave-origin-beta"
"Mod+Alt+L" = "spawn:noctalia msg screen-lock"
"Mod+E" = "spawn:nautilus"
"Mod+Shift+Q" = "spawn:noctalia msg panel-toggle session"

# ⚠ niri: MOD+SHIFT+ESCAPE -> show-hotkey-overlay. Umbriel n'a pas de
# hotkey-overlay au sens niri ; le plus proche est le cheatsheet intégré.
"Mod+Shift+Escape" = "cheatsheet-toggle"

# ─── Audio ───
# ⚠ niri utilisait allow-when-locked=true pour ces binds (fonctionnent
# même écran verrouillé). Je n'ai pas trouvé d'attribut équivalent pour
# les keybinds Umbriel — à vérifier si ces raccourcis marchent bien
# pendant le verrouillage.
"XF86AudioRaiseVolume" = "spawn:noctalia msg volume-up"
"XF86AudioLowerVolume" = "spawn:noctalia msg volume-down"
"XF86AudioMute" = "spawn:noctalia msg volume-mute"
"XF86AudioMicMute" = "spawn:noctalia msg mic-mute"
"XF86AudioPlay" = "spawn:playerctl play-pause"
"XF86AudioPrev" = "spawn:playerctl previous"
"XF86AudioNext" = "spawn:playerctl next"

# ─── Fenêtres : focus / déplacement ───
"Mod+Q" = "window-close"
"Mod+Left" = "window-focus-left"
"Mod+H" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+L" = "window-focus-right"
"Mod+Up" = "window-focus-up"
"Mod+K" = "window-focus-up"
"Mod+Down" = "window-focus-down"
"Mod+J" = "window-focus-down"

"Mod+Ctrl+Left" = "column-move-left"
"Mod+Ctrl+H" = "column-move-left"
"Mod+Ctrl+Right" = "column-move-right"
"Mod+Ctrl+L" = "column-move-right"
"Mod+Ctrl+Up" = "window-move-up"
"Mod+Ctrl+K" = "window-move-up"
"Mod+Ctrl+Down" = "window-move-down"
"Mod+Ctrl+J" = "window-move-down"

# ⚠ niri: focus-column-first/last, move-column-to-first/last — AUCUN
# équivalent trouvé dans la liste d'actions Umbriel (pas de notion de
# "première/dernière colonne"). Binds retirés faute d'action existante.
# MOD+HOME / MOD+END / MOD+CTRL+HOME / MOD+CTRL+END : non mappés.

"Mod+Shift+Left" = "output-focus-left"
"Mod+Shift+Right" = "output-focus-right"
"Mod+Shift+Up" = "output-focus-up"
"Mod+Shift+Down" = "output-focus-down"

"Mod+Shift+Ctrl+Left" = "column-move-to-output-left"
"Mod+Shift+Ctrl+Right" = "column-move-to-output-right"
"Mod+Shift+Ctrl+Up" = "column-move-to-output-up"
"Mod+Shift+Ctrl+Down" = "column-move-to-output-down"

# ─── Molette : navigation ───
# ⚠ Par défaut Umbriel lie déjà Mod+WheelUp/Down à window-focus-left/right.
# Ici on les réassigne à la navigation de workspace pour coller à ton
# usage niri (focus-workspace-down/up). Umbriel n'a pas de notion
# "workspace up/down" : workspace-next/previous naviguent par index sur
# le output courant (pas de wrap). Pas d'équivalent trouvé pour
# MOD+CTRL+WHEEL (déplacer la colonne vers le workspace suivant/précédent) —
# window-move-to-workspace exige un nom explicite, pas de "next/previous".
"Mod+WheelDown" = { action = "workspace-next", repeat = false }
"Mod+WheelUp" = { action = "workspace-previous", repeat = false }

"Mod+WheelRight" = "window-focus-right"
"Mod+WheelLeft" = "window-focus-left"
"Mod+Ctrl+WheelRight" = "column-move-right"
"Mod+Ctrl+WheelLeft" = "column-move-left"

"Mod+Shift+WheelDown" = "window-focus-right"
"Mod+Shift+WheelUp" = "window-focus-left"
"Mod+Ctrl+Shift+WheelDown" = "column-move-right"
"Mod+Ctrl+Shift+WheelUp" = "column-move-left"

# ─── Workspaces nommés (Mod+1..8) ───
# ⚠ CHANGEMENT DE COMPORTEMENT IMPORTANT :
# Sous niri, Mod+1..9 va à la "position N du output actuellement
# focus" (relatif à l'output). Umbriel n'a pas d'action positionnelle
# de ce type quand les workspaces sont nommés : workspace-switch exige
# un NOM exact, global, pas un index relatif au output courant.
# Résultat : Mod+1..8 ci-dessous sautent TOUJOURS vers le même workspace
# nommé précis, peu importe le output où tu es (comportement absolu, pas
# relatif comme avant). Les noms restent uniques entre les deux outputs
# donc pas besoin de suffixe /output.
"Mod+1" = "workspace-switch:\uf0239"   # Firefox / Zen / Brave (Legion #1)
"Mod+2" = "workspace-switch:\ue8da"    # Zed (Legion #2)
"Mod+3" = "workspace-switch:\ue795"    # kitty / Ptyxis (Legion #3)
"Mod+4" = "workspace-switch:\uf0297"   # Steam / jeux (Legion #4)
"Mod+5" = "workspace-switch:\uf024b"   # Fichiers (Legion #5)
"Mod+6" = "workspace-switch:\uf1ff"    # Discord / Element / Telegram (HKC #1)
"Mod+7" = "workspace-switch:\uf075a"   # Spotify / EasyEffects (HKC #2)
"Mod+8" = "workspace-switch:\ue743"    # brave-browser (HKC #3)

"Mod+Ctrl+1" = "window-move-to-workspace:\uf0239"
"Mod+Ctrl+2" = "window-move-to-workspace:\ue8da"
"Mod+Ctrl+3" = "window-move-to-workspace:\ue795"
"Mod+Ctrl+4" = "window-move-to-workspace:\uf0297"
"Mod+Ctrl+5" = "window-move-to-workspace:\uf024b"
"Mod+Ctrl+6" = "window-move-to-workspace:\uf1ff"
"Mod+Ctrl+7" = "window-move-to-workspace:\uf075a"
"Mod+Ctrl+8" = "window-move-to-workspace:\ue743"

# ⚠ niri: MOD+TAB -> focus-workspace-previous (bascule MRU vers le
# dernier workspace actif). workspace-previous d'Umbriel est
# POSITIONNEL (pas de wrap, pas de "dernier actif"), donc ce n'est
# qu'une approximation, pas un vrai équivalent MRU.
"Mod+Tab" = "workspace-previous"
"Alt+Tab" = "spawn:noctalia msg window-switcher"

# ─── Layout ───
# ⚠ niri: expand-column-to-available-width est un "expand" simple, pas
# un toggle. window-toggle-maximize est un TOGGLE (rebasculer réduit la
# largeur). Comportement proche mais pas identique.
"Mod+Ctrl+F" = "window-toggle-maximize"
# ⚠ niri: center-column / center-visible-columns — AUCUN équivalent
# trouvé (window-center d'Umbriel ne fonctionne QUE sur les fenêtres
# flottantes, pas sur les colonnes tuilées). Non mappés.
"Mod+Minus" = "window-modify-width:-0.1"
"Mod+Equal" = "window-modify-width:0.1"
# ⚠ niri: set-window-height +/-10% — AUCUNE action de hauteur de fenêtre
# trouvée dans la doc Umbriel consultée. Non mappés.

# ─── Modes ───
"Mod+T" = "window-toggle-floating"
"Mod+F" = "window-toggle-fullscreen"
# ⚠ niri: MOD+W -> toggle-column-tabbed-display (affichage en onglets
# dans une colonne). Aucune action équivalente trouvée pour Umbriel.
# Non mappé.

# ─── Captures d'écran ───
# ⚠ Umbriel n'a pas d'action native "screenshot" : soit via un submap
# grim/slurp (voir doc), soit via Noctalia (`noctalia msg screenshot-*`).
# J'ai choisi Noctalia pour rester cohérent avec le reste de ta config.
# Pas d'équivalent trouvé pour une capture ciblée "fenêtre active"
# (CTRL+SHIFT+3 dans ta config niri) — laissé sur screenshot-region en
# attendant mieux.
"Ctrl+Shift+1" = "spawn:noctalia msg screenshot-region"
"Ctrl+Shift+2" = "spawn:noctalia msg screenshot-fullscreen"
"Ctrl+Shift+3" = "spawn:noctalia msg screenshot-region"   # ⚠ approximation, voir note

# ⚠ niri: MOD+ESCAPE -> toggle-keyboard-shortcuts-inhibit (débloque les
# raccourcis si une appli plein écran les capture). Aucune action
# équivalente trouvée pour Umbriel. Le mécanisme "d'échappement
# d'urgence" natif d'Umbriel est plutôt `submap:reset` (pour sortir d'un
# submap), concept différent. Non mappé.

"Ctrl+Alt+Delete" = "session-quit"
"Mod+Shift+R" = "spawn:noctalia msg config-reload"
# ⚠ niri: MOD+SHIFT+P -> power-off-monitors (éteint les écrans, DPMS).
# Aucune action Umbriel native trouvée. Possible contournement externe :
# un outil wlr-output-power-management (ex: wlopm) si packagé, à tester.
"Mod+O" = { action = "overview-toggle", repeat = false }

# ═══════════════════════════════════════════════════════════════════════
# Window / layer rules (depuis rules.kdl)
# ═══════════════════════════════════════════════════════════════════════

[[window_rule]]
match.app_id = "^(discord|Element)$"
default_output = "DP-3"
default_workspace = 1
# ⚠ interprétation : ta règle niri définissait une position flottante
# mémorisée SANS forcer open-floating (la fenêtre s'ouvrait tuilée avec
# une largeur/hauteur fixes). Umbriel ne sait pas donner une taille
# fixe en pixels à une colonne tuilée (default_width n'accepte qu'une
# fraction). J'ai donc choisi de la rendre flottante pour respecter la
# taille et la position demandées à l'identique — dis-moi si tu voulais
# plutôt du tuilé (dans ce cas il faudra utiliser une fraction).
default_floating = true
default_size = [1316, 1011]
default_position = { x = 0, y = 0, anchor = "top_left" }

[[window_rule]]
match.app_id = "^org\\.telegram\\.desktop$"
default_output = "DP-3"
default_workspace = 1
default_floating = true
default_size = [555, 1011]
default_position = { x = 0, y = 0, anchor = "top_right" }

[[window_rule]]
match.app_id = "^com\\.mitchellh\\.ghostty$"
default_floating = true
default_size = [1505, 755]
blur = true
# ⚠ niri: xray false sur cette fenêtre — voir blur_ignore_alpha plus bas
# (règle globale) ; pas de champ par-fenêtre équivalent trouvé ici.

[[window_rule]]
match.app_id = "^firefox$"
default_output = "DP-1"
default_workspace = 1
default_maximize = true

[[window_rule]]
match.title = "^About Mozilla Firefox$"
default_output = "DP-1"
default_workspace = 1
default_floating = true

[[window_rule]]
match.app_id = "^dev\\.zed\\.Zed$"
default_output = "DP-1"
default_workspace = 2
default_maximize = true

[[window_rule]]
match.app_id = "^zen-twilight$"
default_output = "DP-1"
default_workspace = 1
default_maximize = true
opacity = 0.95
blur = true
# ⚠ niri: draw-border-with-background false — aucun champ équivalent
# trouvé côté Umbriel, ignoré.

[[window_rule]]
match.title = "^About Zen Twilight$"
default_output = "DP-1"
default_workspace = 1
default_floating = true
opacity = 0.95
blur = true

[[window_rule]]
match.app_id = "^brave-origin-beta$"
default_output = "DP-1"
default_workspace = 1
default_maximize = true

[[window_rule]]
# ⚠ niri: open-focused true sur la boîte "Save As" de Nautilus. Aucun
# champ Umbriel "focus new window on open" trouvé — focus_on_activate ne
# couvre que les requêtes d'activation, pas le comportement au mappage
# initial. Règle conservée pour le matching mais sans effet garanti ;
# à vérifier en pratique (peut-être déjà le comportement par défaut).
match.app_id = "^org\\.gnome\\.Nautilus$"
match.title = "^Save As$"

[[window_rule]]
match.app_id = "^steam$"
default_output = "DP-1"
default_workspace = 4
default_maximize = true

[[window_rule]]
match.app_id = "^openrgb$"
default_output = "DP-1"
default_workspace = 4

[[window_rule]]
match.app_id = "^kitty$"
default_output = "DP-1"
default_workspace = 3
default_floating = true

[[window_rule]]
match.app_id = "^org\\.gnome\\.Ptyxis$"
default_output = "DP-1"
default_workspace = 3

[[window_rule]]
match.app_id = "^brave-browser$"
default_output = "DP-3"
default_workspace = 3
default_maximize = true

[[window_rule]]
match.app_id = "^steam_app_.*$"
default_output = "DP-1"
default_workspace = 4
default_fullscreen = true

[[window_rule]]
match.app_id = "^heroic$"
default_output = "DP-1"
default_workspace = 4
default_fullscreen = true

[[window_rule]]
match.app_id = "^org\\.prismlauncher\\.PrismLauncher$"
default_output = "DP-1"
default_workspace = 4
default_maximize = true

[[window_rule]]
match.app_id = "^Minecraft$"
default_output = "DP-1"
default_workspace = 4
default_fullscreen = true

[[window_rule]]
match.app_id = "^firefox$"
match.title = "^Picture-in-Picture$"
default_floating = true

[[window_rule]]
match.app_id = "^zen$"
match.title = "^Picture-in-Picture$"
default_floating = true

[[window_rule]]
match.app_id = "^brave$"
match.title = "^Picture-in-Picture$"
default_floating = true

[[window_rule]]
match.app_id = "^steam$"
match.title = "^notificationtoasts_\\d+_desktop$"
# ⚠ ajouté par rapport à l'original : default_floating=true. Umbriel
# n'applique default_position qu'aux fenêtres flottantes, alors que niri
# mémorisait juste une position potentielle sans forcer le flottant.
# Sans ce forçage la position ne s'appliquerait jamais.
default_floating = true
default_position = { x = 10, y = 10, anchor = "bottom_right" }

[[window_rule]]
match.title = "^Friends List$"
default_output = "DP-1"
default_workspace = 4
default_floating = true

[[window_rule]]
# ⚠ niri excluait aussi app-id=xdg-desktop-portal(-gtk)? en plus du
# titre — probablement redondant puisque app_id est déjà filtré sur
# Nautilus exact, donc pas repris. Le (?i) insensible à la casse de
# niri n'est pas confirmé supporté par Umbriel (regex ECMAScript sans
# mention explicite de flags dans la doc) : à vérifier si les dialogues
# en majuscules/minuscules mixtes sont bien exclus.
match.app_id = "^org\\.gnome\\.Nautilus$"
match.title = "^(?!(Open|Open File|Save As|Save File|Enregistrer|Enregistrer Sous|Ouvrir|Choisir un Fichier)$).*$"
default_output = "DP-1"
default_workspace = 5
default_maximize = true

[[window_rule]]
match.app_id = "^org\\.gnome\\.TextEditor$"
default_output = "DP-1"
default_workspace = 5

[[window_rule]]
match.app_id = "^Spotify$"
default_output = "DP-3"
default_workspace = 2
default_maximize = true

[[window_rule]]
match.app_id = "^(com\\.kde\\.easyeffects|com\\.github\\.wwmm\\.easyeffects)$"
default_output = "DP-3"
default_workspace = 2

# ⚠ niri: window-rule global { geometry-corner-radius 20; clip-to-geometry
# true } — le rayon des coins est déjà réglé globalement via
# appearance.corner_radius plus haut (Umbriel ne le gère qu'au niveau
# compositeur, pas par règle de fenêtre). clip-to-geometry n'a pas
# d'équivalent trouvé — probablement déjà implicite.

[[window_rule]]
# niri: window-rule global { background-effect { blur true; xray false } }
blur = true
blur_ignore_alpha = 0.0   # ⚠ approximation de "xray false" (aucune zone
                            # transparente non floutée) — à valider visuellement

# ⚠ niri: layer-rule match.namespace="^noctalia-wallpaper*" +
# place-within-backdrop true — pas de champ "place_within_backdrop"
# trouvé dans les layer_rule Umbriel (seulement blur/blur_popups/
# blur_ignore_alpha/blur_optimized). Probablement inutile de toute façon
# vu le support Noctalia natif d'Umbriel. Non repris.

[[layer_rule]]
# Reprend l'exemple officiel Umbriel/Noctalia (plus complet que ta règle
# niri d'origine qui ne touchait que xray) :
# https://docs.noctalia.dev/umbriel/rules/
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd|desktop-widget-[^\"]*)$"
blur = true
blur_ignore_alpha = 0.5
blur_popups = true

[[layer_rule]]
match.namespace = "^noctalia-window-switcher$"
blur = true
blur_ignore_alpha = 0.0
