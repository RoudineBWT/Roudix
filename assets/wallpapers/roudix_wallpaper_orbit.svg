<svg width="100%" height="100%" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Roudix Wallpaper — Catppuccin Mocha</title>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="55%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fab387" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#eba0ac" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#eba0ac" stop-opacity="0"/>
    </radialGradient>

    <!-- one arm of the snowflake, reused six times -->
    <g id="arm">
      <rect x="-14" y="-155" width="28" height="110" rx="14" fill="#fab387"/>
      <polygon points="0,-170 12,-148 0,-130 -12,-148" fill="#f2cdcd"/>
      <g transform="rotate(-30) translate(0,-100)">
        <rect x="-10" y="-50" width="20" height="52" rx="10" transform="rotate(30)" fill="#eba0ac"/>
        <polygon points="0,-60 8,-42 0,-26 -8,-42" transform="rotate(30)" fill="#f2cdcd"/>
      </g>
      <g transform="rotate(30) translate(0,-100)">
        <rect x="-10" y="-50" width="20" height="52" rx="10" transform="rotate(-30)" fill="#eba0ac"/>
        <polygon points="0,-60 8,-42 0,-26 -8,-42" transform="rotate(-30)" fill="#f2cdcd"/>
      </g>
    </g>

    <g id="snowflake">
      <use href="#arm"/>
      <use href="#arm" transform="rotate(60)"/>
      <use href="#arm" transform="rotate(120)"/>
      <use href="#arm" transform="rotate(180)"/>
      <use href="#arm" transform="rotate(240)"/>
      <use href="#arm" transform="rotate(300)"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#f5e0dc" stroke-width="18"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="#eba0ac" stroke-width="10"/>
      <circle cx="0" cy="0" r="10" fill="#fab387"/>
    </g>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#bg)"/>

  <!-- faint corner snowflakes for depth -->
  <g opacity="0.05">
    <use href="#snowflake" transform="translate(120,120) scale(1.3)"/>
    <use href="#snowflake" transform="translate(1800,950) scale(1.6) rotate(20)"/>
    <use href="#snowflake" transform="translate(1780,140) scale(0.8) rotate(-15)"/>
    <use href="#snowflake" transform="translate(90,960) scale(0.9) rotate(10)"/>
  </g>

  <!-- thin ring accents -->
  <circle cx="960" cy="500" r="360" fill="none" stroke="#313244" stroke-width="1.5" opacity="0.5"/>
  <circle cx="960" cy="500" r="460" fill="none" stroke="#313244" stroke-width="1" opacity="0.35"/>

  <!-- glow behind the mark -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#glow)"/>

  <!-- main logo -->
  <use href="#snowflake" transform="translate(960,470) scale(1.55)"/>

  <!-- wordmark -->
  <text x="960" y="740" text-anchor="middle"
        font-family="'JetBrains Mono','DejaVu Sans Mono',monospace"
        font-size="72" font-weight="700" letter-spacing="18"
        fill="#cdd6f4">ROUDIX</text>
  <text x="960" y="782" text-anchor="middle"
        font-family="'JetBrains Mono','DejaVu Sans Mono',monospace"
        font-size="22" letter-spacing="10"
        fill="#a6adc8">NIXOS · CATPPUCCIN MOCHA</text>
</svg>
