<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bgD" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a211b"/>
      <stop offset="1" stop-color="#211a15"/>
    </linearGradient>
    <linearGradient id="sheenD" x1="24" y1="3" x2="24" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shieldD" x1="12" y1="9" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2b05e"/>
      <stop offset="1" stop-color="#ff8c42"/>
    </linearGradient>
    <radialGradient id="glowD" cx="24" cy="23" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8c42" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8c42" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle, same shape as the other Roudix apps -->
  <rect x="3" y="3" width="42" height="42" rx="10" fill="url(#bgD)"/>
  <rect x="3" y="3" width="42" height="17" rx="10" fill="url(#sheenD)"/>
  <rect x="3" y="3" width="42" height="42" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <circle cx="24" cy="23" r="14" fill="url(#glowD)"/>

  <!-- shield -->
  <path d="M24 9 L36 13.5 V23 C36 31 31 36.5 24 39.5 C17 36.5 12 31 12 23 V13.5 Z" fill="url(#shieldD)"/>

  <!-- keyhole -->
  <circle cx="24" cy="21.5" r="3.4" fill="#2a211b"/>
  <path d="M22.4 23.5 H25.6 L26.4 30 H21.6 Z" fill="#2a211b"/>
</svg>
