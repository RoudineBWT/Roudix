<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="128" height="128" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4c60"/>
      <stop offset="0.45" stop-color="#363849"/>
      <stop offset="1" stop-color="#232433"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7f849c"/>
      <stop offset="1" stop-color="#585b70"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fab387" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fab387" stop-opacity="0"/>
    </radialGradient>
    <!-- Roudix snowflake arm (peach arm, flamingo tip, two maroon side branches) -->
    <g id="arm">
      <rect x="-14" y="-155" width="28" height="110" rx="14" fill="#fab387"/>
      <polygon points="0,-130 -12,-148 0,-170 12,-148" fill="#f2cdcd"/>
      <g transform="rotate(-30,-186.60254,50)">
        <rect x="-10" y="-50" width="20" height="52" rx="10" transform="rotate(30)" fill="#eba0ac"/>
        <polygon points="0,-26 -8,-42 0,-60 8,-42" transform="rotate(30)" fill="#f2cdcd"/>
      </g>
      <g transform="rotate(30,186.60254,50)">
        <rect x="-10" y="-50" width="20" height="52" rx="10" transform="rotate(-30)" fill="#eba0ac"/>
        <polygon points="0,-26 -8,-42 0,-60 8,-42" transform="rotate(-30)" fill="#f2cdcd"/>
      </g>
    </g>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="64" cy="118.5" rx="44" ry="4" fill="#000" opacity="0.22"/>

  <!-- handle (behind the bag) -->
  <path d="M45 40 V27 a8 8 0 0 1 8 -8 h22 a8 8 0 0 1 8 8 V40" fill="none" stroke="url(#handle)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bag body -->
  <rect x="14" y="36" width="100" height="79" rx="11" fill="url(#body)"/>
  <!-- thin light rim: keeps the silhouette readable on dark backgrounds -->
  <rect x="14.5" y="36.5" width="99" height="78" rx="10.5" fill="none" stroke="#cdd6f4" stroke-opacity="0.22"/>
  <!-- top lip -->
  <path d="M14 47 a11 11 0 0 1 11 -11 h78 a11 11 0 0 1 11 11 V50 H14 Z" fill="#fff" opacity="0.07"/>
  <rect x="14" y="48" width="100" height="1.6" fill="#000" opacity="0.18"/>
  <!-- eyelets where the handle goes in -->
  <circle cx="45" cy="44" r="2.2" fill="#181825"/>
  <circle cx="83" cy="44" r="2.2" fill="#181825"/>

  <!-- logo: uniform scale, centred in the body below the lip -->
  <circle cx="64" cy="82.5" r="38" fill="url(#glow)"/>
  <g transform="translate(64 82.5) scale(0.175)">
    <use xlink:href="#arm"/>
    <use xlink:href="#arm" transform="rotate(60)"/>
    <use xlink:href="#arm" transform="rotate(120)"/>
    <use xlink:href="#arm" transform="rotate(180)"/>
    <use xlink:href="#arm" transform="rotate(240)"/>
    <use xlink:href="#arm" transform="rotate(300)"/>
    <circle r="42" fill="none" stroke="#f5e0dc" stroke-width="18"/>
    <circle r="24" fill="none" stroke="#eba0ac" stroke-width="10"/>
    <circle r="10" fill="#fab387"/>
  </g>
</svg>
