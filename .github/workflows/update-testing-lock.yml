name: Update testing flake.lock

on:
  schedule:
    - cron: '0 1 * * *'  # tous les jours à 01h00 UTC
  workflow_dispatch:

# Évite que ce job et le merge dev→testing poussent en même temps
concurrency:
  group: testing-branch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Update flake inputs
        run: nix flake update --accept-flake-config

      - name: Check whether flake.lock changed
        id: lock_status
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "flake.lock already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create CI-only stubs for required machine-local files
        if: steps.lock_status.outputs.changed == 'true'
        id: local_stubs
        run: |
          CREATED=""

          if [ ! -f hosts/roudix/hardware-configuration.nix ]; then
            cat > hosts/roudix/hardware-configuration.nix << 'EOF'
          { config, lib, pkgs, modulesPath, ... }:

          {
            imports = [ (modulesPath + "/installer/scan/not-detected.nix") ];

            boot.initrd.availableKernelModules = [ "xhci_pci" "ahci" "nvme" "usbhid" "sd_mod" ];
            boot.initrd.kernelModules = [ ];
            boot.kernelModules = [ "kvm-intel" ];
            boot.extraModulePackages = [ ];

            fileSystems."/" = {
              device = "/dev/disk/by-label/nixos";
              fsType = "ext4";
            };

            swapDevices = [ ];

            nixpkgs.hostPlatform = lib.mkDefault "x86_64-linux";
            hardware.cpu.intel.updateMicrocode = lib.mkDefault true;
          }
          EOF
            git add -N -f hosts/roudix/hardware-configuration.nix
            CREATED="$CREATED hosts/roudix/hardware-configuration.nix"
          fi

          if [ ! -f hosts/roudix/username.nix ]; then
            cat > hosts/roudix/username.nix << 'EOF'
          "ci-runner"
          EOF
            git add -N -f hosts/roudix/username.nix
            CREATED="$CREATED hosts/roudix/username.nix"
          fi

          echo "created_files=$CREATED" >> "$GITHUB_OUTPUT"

      # Si le build casse, on ne pousse rien : testing garde son ancien lock.
      - name: Build NixOS configuration (validation gate)
        if: steps.lock_status.outputs.changed == 'true'
        run: |
          nix build .#nixosConfigurations.roudix.config.system.build.toplevel \
            --accept-flake-config \
            --no-link \
            -L

      - name: Remove CI-only stubs
        if: steps.lock_status.outputs.changed == 'true' && steps.local_stubs.outputs.created_files != ''
        run: |
          for f in ${{ steps.local_stubs.outputs.created_files }}; do
            git reset -- "$f"
            rm -f "$f"
          done

      - name: Commit and push
        if: steps.lock_status.outputs.changed == 'true'
        run: |
          git add flake.lock
          git commit -m "chore: nix flake update (auto, daily)"
          git push origin testing
