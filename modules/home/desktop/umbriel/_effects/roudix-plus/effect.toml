# Roudix — "roudix-plus" Umbriel effect presets.
# Loaded in addition to ../roudix/effect.toml (window in/out + scratchpad),
# see _animation.nix. Shader paths are relative to THIS file. Presets only
# register effects; the setups in _animation.nix select them.
# All original work (no third-party shader code).

[effects.preset.roudix-edge]
kind = "border"
shader = "edge.glsl"
palette = true
padding = 6
speed = 0.6
# animated = false   # static gradient, no per-frame cost

[effects.preset.roudix-halo]
kind = "cursor"
shader = "halo.glsl"
palette = true
radius = 28

[effects.preset.roudix-workspace]
kind = "animation"
shader = "workspace.glsl"

[effects.preset.roudix-layer]
kind = "animation"
shader = "layer.glsl"

[effects.preset.roudix-focus]
kind = "animation"
shader = "focus.glsl"

# Opt-in only: select with `effects.screen = "roudix-vignette"` in
# umbriel-custom.nix. Disables direct scanout on that output.
[effects.preset.roudix-vignette]
kind = "screen"
shader = "vignette.glsl"

[effects.preset.roudix-wobble]
kind = "animation"
shader = "wobble.glsl"

# Shared by windows_in and windows_out (direction-aware). Palette = Peach/Maroon
# of the logo when [colors] is Catppuccin Mocha.
[effects.preset.roudix-logo]
kind = "animation"
shader = "logo.glsl"
palette = true

# "Snowflake braid" border + its inner-glow overlay. `padding` MUST equal PAD
# in orbit.glsl. Windows are 9 px apart, so keep ring + padding below ~8.
# Cheaper: delete the `overlay` line and/or the [light] table below.
[effects.preset.roudix-orbit]
kind = "border"
shader = "orbit.glsl"
palette = true
padding = 6
speed = 1.0
overlay = "roudix-orbit-inner"
# animated = false   # frozen braid, no per-frame cost

# Light the border casts onto its surroundings (adds rendering cost; the
# brightness varies with output scale). Remove this table to disable.
[effects.preset.roudix-orbit.light]
spread = 40
intensity = 0.6
threshold = 0.5

# Window overlay used by roudix-orbit (companion: do not also select it).
[effects.preset.roudix-orbit-inner]
kind = "window"
shader = "orbit-inner.glsl"
palette = true

[effects.preset.roudix-focus-sweep]
kind = "animation"
shader = "focus-sweep.glsl"

# "Aurora": one thin, slightly irregular stem around the window with a soft
# light flowing through it (a field, not a comet), tiny light-driven snowflake
# glints, and a faint inner-edge glow overlay.
# `padding` MUST equal PAD in aurora.glsl. Windows are 9 px apart, so keep
# ring + padding below ~8. Cheaper: drop the `overlay` line.
[effects.preset.roudix-aurora]
kind = "border"
shader = "aurora.glsl"
palette = true
padding = 5
speed = 1.0
overlay = "roudix-aurora-inner"
# animated = false   # frozen light, no per-frame cost

# Optional: light cast onto the surroundings (adds rendering cost; brightness
# varies with output scale). Uncomment to try.
# [effects.preset.roudix-aurora.light]
# spread = 40
# intensity = 0.5
# threshold = 0.5

# Companion window preset of roudix-aurora: do not also select it in [effects].
[effects.preset.roudix-aurora-inner]
kind = "window"
shader = "aurora-inner.glsl"
palette = true

# Focus transition for the aurora border: two fronts zip around the window.
[effects.preset.roudix-focus-zip]
kind = "animation"
shader = "focus-zip.glsl"
