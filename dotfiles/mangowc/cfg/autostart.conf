# ──────────────────────────────────────
# AUTOSTART
# ──────────────────────────────────────

# Shell / Wallpaper
exec-once=noctalia

# Apps
exec-once=discord
exec-once=openrgb


# XDG Desktop Portal — nécessaire pour Pipewire screen capture (OBS, Discord Go Live...)
# dbus-update-activation-environment --systemd propage déjà vers systemd ET dbus,
# donc pas besoin d'un import-environment séparé. Ce qui manquait vraiment : démarrer
# mango-session.target, qui BindsTo=graphical-session.target (static, RefuseManualStart=yes,
# ne peut être atteint que via un target qui lui est BindsTo — cf. mangowc.nix).
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once=systemctl --user start mango-session.target
