<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="bgL" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbf5ee"/>
      <stop offset="1" stop-color="#f1e6d9"/>
    </linearGradient>
    <linearGradient id="sheenL" x1="24" y1="3" x2="24" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shieldL" x1="12" y1="9" x2="36" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e8a23a"/>
      <stop offset="1" stop-color="#e0661a"/>
    </linearGradient>
    <radialGradient id="glowL" cx="24" cy="23" r="14" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0661a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#e0661a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle, same shape as the other Roudix apps -->
  <rect x="3" y="3" width="42" height="42" rx="10" fill="url(#bgL)"/>
  <rect x="3" y="3" width="42" height="17" rx="10" fill="url(#sheenL)"/>
  <rect x="3" y="3" width="42" height="42" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <circle cx="24" cy="23" r="14" fill="url(#glowL)"/>

  <!-- shield -->
  <path d="M24 9 L36 13.5 V23 C36 31 31 36.5 24 39.5 C17 36.5 12 31 12 23 V13.5 Z" fill="url(#shieldL)"/>

  <!-- keyhole -->
  <circle cx="24" cy="21.5" r="3.4" fill="#fbf5ee"/>
  <path d="M22.4 23.5 H25.6 L26.4 30 H21.6 Z" fill="#fbf5ee"/>
</svg>
