<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Papirus/Tela style: squircle badge, flat fills, no gradients, limited palette -->

  <!-- Squircle base -->
  <rect x="3" y="3" width="42" height="42" rx="11" fill="#3a4a5c"/>
  <rect x="3" y="3" width="42" height="21" rx="11" fill="#ffffff" opacity="0.04"/>

  <!-- Chip body -->
  <rect x="12" y="12" width="24" height="24" rx="5" fill="#5294e2"/>

  <!-- Chip die -->
  <rect x="16.5" y="16.5" width="15" height="15" rx="3" fill="#3f7fd1"/>

  <!-- Pins, flat, simplified to 3 per side -->
  <rect x="14" y="5"  width="2.4" height="5" rx="1.2" fill="#5294e2"/>
  <rect x="22.8" y="5" width="2.4" height="5" rx="1.2" fill="#5294e2"/>
  <rect x="31.6" y="5" width="2.4" height="5" rx="1.2" fill="#5294e2"/>

  <rect x="14" y="38"  width="2.4" height="5" rx="1.2" fill="#5294e2"/>
  <rect x="22.8" y="38" width="2.4" height="5" rx="1.2" fill="#5294e2"/>
  <rect x="31.6" y="38" width="2.4" height="5" rx="1.2" fill="#5294e2"/>

  <rect x="5" y="14"  width="5" height="2.4" rx="1.2" fill="#5294e2"/>
  <rect x="5" y="22.8" width="5" height="2.4" rx="1.2" fill="#5294e2"/>
  <rect x="5" y="31.6" width="5" height="2.4" rx="1.2" fill="#5294e2"/>

  <rect x="38" y="14"  width="5" height="2.4" rx="1.2" fill="#5294e2"/>
  <rect x="38" y="22.8" width="5" height="2.4" rx="1.2" fill="#5294e2"/>
  <rect x="38" y="31.6" width="5" height="2.4" rx="1.2" fill="#5294e2"/>

  <!-- Switch/cycle glyph inside die: two curved arrows forming a loop, flat white -->
  <path d="M 20.5 21.5
           A 4.5 4.5 0 0 1 28.8 20"
        fill="none" stroke="#eaf2fc" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 27.2 18.6 L 28.8 20 L 27 21.3" fill="none" stroke="#eaf2fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M 27.5 26.5
           A 4.5 4.5 0 0 1 19.2 28"
        fill="none" stroke="#eaf2fc" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 20.8 29.4 L 19.2 28 L 21 26.7" fill="none" stroke="#eaf2fc" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Status badge, flat accent circle, Papirus-style bottom-right badge -->
  <circle cx="35" cy="35" r="6.5" fill="#3a4a5c"/>
  <circle cx="35" cy="35" r="5" fill="#f67400"/>
  <path d="M 32.6 35 L 37.4 35 M 35 32.6 L 35 33.7 M 35 36.3 L 35 37.4" stroke="#fff3e6" stroke-width="1.3" stroke-linecap="round"/>

</svg>
