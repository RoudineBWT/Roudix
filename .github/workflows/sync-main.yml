name: Sync testing to main

on:
  schedule:
    - cron: '0 3 */2 * *'  # tous les 2 jours à 03h00 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: testing
          fetch-depth: 0

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          docker system prune -af

      - name: Build config
        run: nix build .#nixosConfigurations.roudix.config.system.build.toplevel --no-link --accept-flake-config --allow-dirty-locks

  merge:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge testing into main
        run: |
          git fetch origin testing
          git merge origin/testing --no-edit

      - name: Push
        run: git push origin main
