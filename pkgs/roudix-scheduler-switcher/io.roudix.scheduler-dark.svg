<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Tokyo Night background gradient, à la Papirus/Tela-dark -->
    <linearGradient id="bgD" x1="6" y1="4" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0"   stop-color="#2a2b42"/>
      <stop offset="1"   stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="sheenD" x1="24" y1="3" x2="24" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dialD" x1="10" y1="34" x2="38" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.55" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#fab387"/>
    </linearGradient>
    <radialGradient id="flakeGlowD" cx="24" cy="17" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fab387" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fab387" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- squircle Papirus/Tela : coin ~22% -->
  <rect x="3" y="3" width="42" height="42" rx="10" fill="url(#bgD)"/>
  <rect x="3" y="3" width="42" height="17" rx="10" fill="url(#sheenD)"/>
  <rect x="3" y="3" width="42" height="42" rx="10" fill="none"
        stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>

  <circle cx="24" cy="17" r="9" fill="url(#flakeGlowD)"/>

  <!-- flocon Roudix -->
  <g stroke="#cad3f5" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
    <g transform="translate(24 17)">
      <line x1="0" y1="-7" x2="0" y2="7"/>
      <line x1="-6.06" y1="-3.5" x2="6.06" y2="3.5"/>
      <line x1="-6.06" y1="3.5" x2="6.06" y2="-3.5"/>
      <line x1="0" y1="-7" x2="-2" y2="-4.3"/>
      <line x1="0" y1="-7" x2="2" y2="-4.3"/>
      <line x1="0" y1="7" x2="-2" y2="4.3"/>
      <line x1="0" y1="7" x2="2" y2="4.3"/>
    </g>
  </g>

  <!-- jauge de scheduler -->
  <g>
    <path d="M 11 35 A 13 13 0 0 1 37 35"
          fill="none" stroke="#414868" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 11 35 A 13 13 0 0 1 30.5 24.2"
          fill="none" stroke="url(#dialD)" stroke-width="3.4" stroke-linecap="round"/>
    <g stroke="#565f89" stroke-width="1.1" stroke-linecap="round">
      <line x1="11" y1="35" x2="13.2" y2="35"/>
      <line x1="15.9" y1="24.9" x2="17.6" y2="26.6"/>
      <line x1="24" y1="21.7" x2="24" y2="24"/>
      <line x1="32.1" y1="24.9" x2="30.4" y2="26.6"/>
      <line x1="37" y1="35" x2="34.8" y2="35"/>
    </g>
    <line x1="24" y1="35" x2="18.5" y2="28.5"
          stroke="#f7f8fa" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="24" cy="35" r="2.4" fill="#f7f8fa"/>
    <circle cx="24" cy="35" r="1" fill="#1a1b26"/>
  </g>
</svg>
