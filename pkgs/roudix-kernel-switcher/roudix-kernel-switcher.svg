<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>

  <!-- Catppuccin Mocha (accent Peach): base #1e1e2e, chip #fab387, die #d9986c, badge #cba6f7 -->

  <!-- Squircle base -->
  <rect x="3" y="3" width="42" height="42" rx="11" fill="#1e1e2e"/>
  <rect x="3" y="3" width="42" height="21" rx="11" fill="#cdd6f4" opacity="0.04"/>

  <!-- Chip body -->
  <rect x="12" y="12" width="24" height="24" rx="5" fill="#fab387"/>

  <!-- Chip die -->
  <rect x="16.5" y="16.5" width="15" height="15" rx="3" fill="#d9986c"/>

  <!-- Pins, flat, simplifiés à 3 par côté -->
  <rect x="14" y="5"  width="2.4" height="5" rx="1.2" fill="#fab387"/>
  <rect x="22.8" y="5" width="2.4" height="5" rx="1.2" fill="#fab387"/>
  <rect x="31.6" y="5" width="2.4" height="5" rx="1.2" fill="#fab387"/>

  <rect x="14" y="38"  width="2.4" height="5" rx="1.2" fill="#fab387"/>
  <rect x="22.8" y="38" width="2.4" height="5" rx="1.2" fill="#fab387"/>
  <rect x="31.6" y="38" width="2.4" height="5" rx="1.2" fill="#fab387"/>

  <rect x="5" y="14"  width="5" height="2.4" rx="1.2" fill="#fab387"/>
  <rect x="5" y="22.8" width="5" height="2.4" rx="1.2" fill="#fab387"/>
  <rect x="5" y="31.6" width="5" height="2.4" rx="1.2" fill="#fab387"/>

  <rect x="38" y="14"  width="5" height="2.4" rx="1.2" fill="#fab387"/>
  <rect x="38" y="22.8" width="5" height="2.4" rx="1.2" fill="#fab387"/>
  <rect x="38" y="31.6" width="5" height="2.4" rx="1.2" fill="#fab387"/>

  <!-- Glyphe switch/cycle dans le die : deux flèches courbes formant une boucle -->
  <path d="M 20.5 21.5
           A 4.5 4.5 0 0 1 28.8 20"
        fill="none" stroke="#11111b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 27.2 18.6 L 28.8 20 L 27 21.3" fill="none" stroke="#11111b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <path d="M 27.5 26.5
           A 4.5 4.5 0 0 1 19.2 28"
        fill="none" stroke="#11111b" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 20.8 29.4 L 19.2 28 L 21 26.7" fill="none" stroke="#11111b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Badge de statut, accent Mauve pour contraster avec le peach -->
  <circle cx="35" cy="35" r="6.5" fill="#1e1e2e"/>
  <circle cx="35" cy="35" r="5" fill="#cba6f7"/>
  <path d="M 32.6 35 L 37.4 35 M 35 32.6 L 35 33.7 M 35 36.3 L 35 37.4" stroke="#11111b" stroke-width="1.3" stroke-linecap="round"/>

</svg>
