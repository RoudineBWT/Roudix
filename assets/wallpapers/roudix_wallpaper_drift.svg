<svg width="100%" height="100%" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Roudix Wallpaper — Drift (Catppuccin Mocha)</title>

  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="60%" stop-color="#11111b"/>
      <stop offset="100%" stop-color="#1e1e2e"/>
    </linearGradient>

    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eba0ac" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#fab387" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fab387" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dots" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#313244"/>
    </pattern>

    <g id="arm2">
      <rect x="-14" y="-155" width="28" height="110" rx="14" fill="#fab387"/>
      <polygon points="0,-170 12,-148 0,-130 -12,-148" fill="#f2cdcd"/>
      <g transform="rotate(-30) translate(0,-100)">
        <rect x="-10" y="-50" width="20" height="52" rx="10" transform="rotate(30)" fill="#eba0ac"/>
        <polygon points="0,-60 8,-42 0,-26 -8,-42" transform="rotate(30)" fill="#f2cdcd"/>
      </g>
      <g transform="rotate(30) translate(0,-100)">
        <rect x="-10" y="-50" width="20" height="52" rx="10" transform="rotate(-30)" fill="#eba0ac"/>
        <polygon points="0,-60 8,-42 0,-26 -8,-42" transform="rotate(-30)" fill="#f2cdcd"/>
      </g>
    </g>

    <g id="snowflake2">
      <use href="#arm2"/>
      <use href="#arm2" transform="rotate(60)"/>
      <use href="#arm2" transform="rotate(120)"/>
      <use href="#arm2" transform="rotate(180)"/>
      <use href="#arm2" transform="rotate(240)"/>
      <use href="#arm2" transform="rotate(300)"/>
      <circle cx="0" cy="0" r="42" fill="none" stroke="#f5e0dc" stroke-width="18"/>
      <circle cx="0" cy="0" r="24" fill="none" stroke="#eba0ac" stroke-width="10"/>
      <circle cx="0" cy="0" r="10" fill="#fab387"/>
    </g>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#bg2)"/>
  <rect x="0" y="0" width="1920" height="1080" fill="url(#dots)" opacity="0.5"/>

  <!-- diagonal band -->
  <polygon points="0,1080 1920,320 1920,1080" fill="#181825" opacity="0.55"/>
  <polygon points="0,1080 1920,320 1920,420 0,1080" fill="none" stroke="#45475a" stroke-width="1" opacity="0.4"/>

  <!-- drifting faint snowflakes -->
  <g opacity="0.06">
    <use href="#snowflake2" transform="translate(1650,230) scale(1.1) rotate(15)"/>
    <use href="#snowflake2" transform="translate(220,880) scale(0.7) rotate(-25)"/>
    <use href="#snowflake2" transform="translate(1780,900) scale(0.55) rotate(40)"/>
  </g>

  <!-- glow -->
  <rect x="0" y="0" width="1920" height="1080" fill="url(#glow2)"/>

  <!-- main mark, off-center left -->
  <use href="#snowflake2" transform="translate(560,540) scale(1.9)"/>

  <!-- wordmark, right-aligned -->
  <text x="1780" y="600" text-anchor="end"
        font-family="'JetBrains Mono','DejaVu Sans Mono',monospace"
        font-size="88" font-weight="700" letter-spacing="14"
        fill="#cdd6f4">ROUDIX</text>
  <line x1="1330" y1="632" x2="1780" y2="632" stroke="#fab387" stroke-width="3" opacity="0.8"/>
  <text x="1780" y="666" text-anchor="end"
        font-family="'JetBrains Mono','DejaVu Sans Mono',monospace"
        font-size="24" letter-spacing="6"
        fill="#a6adc8">A NIXOS-BASED DISTRIBUTION</text>
</svg>
